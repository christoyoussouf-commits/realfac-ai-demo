<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>REALFACE - Comme ta capture Mark</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>
<body>
<div class="tiktok-player">
  <!-- Top status bar like iPhone -->
  <div class="status-bar">
    <span>22:37</span>
    <div class="right-icons"><span>LTE</span> <span>🔋</span></div>
  </div>

  <!-- MAIN RESULT - Large (Mark qui fait tes gestes) -->
  <div class="main-stage">
    <canvas id="resultCanvas"></canvas>
    <video id="video" autoplay playsinline muted style="display:none"></video>
    <div id="placeholderMain" class="placeholder-main"><div class="icon">∞</div><p>Choisis qui tu veux devenir (ex: Mark)</p><small>Ton visage remplacera le sien avec tes gestes</small></div>
    
    <!-- Small PIP - TOI en haut à gauche comme sur capture -->
    <div class="pip-source">
      <canvas id="pipCanvas"></canvas>
      <div id="pipPlaceholder" class="pip-placeholder">TOI</div>
    </div>

    <!-- Comment bubble comme sur capture -->
    <div class="comment-bubble" id="commentBubble">
      <div class="comment-line">Réponds au commentaire de</div>
      <div class="comment-name">KING CHELSEA DLS CIV</div>
      <div class="comment-text">🔵 [Sticker] Mark quoi ?</div>
    </div>

    <!-- ChapCam watermark comme sur capture -->
    <div class="watermark">
      <div class="wm-text">chapcam.com</div>
      <div class="wm-logo">∞</div>
    </div>

    <!-- Bottom controls comme TikTok -->
    <div class="bottom-controls">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div><div class="progress-dot" id="progressDot"></div></div>
      <div class="controls-row">
        <button class="close-btn" id="btnClose">✕</button>
        <div class="right-controls">
          <button class="play-btn" id="btnPlay">▶</button>
          <span class="speed">1×</span>
        </div>
      </div>
    </div>

    <!-- Top controls for setup -->
    <div class="top-setup" id="topSetup">
      <label class="upload-mark"><input type="file" id="targetFile" accept="image/*,video/*">📸 Devenir qui ?</label>
      <button id="btnStart" class="start-btn">▶️ LANCER SWAP MARK</button>
      <button id="btnStop" class="stop-btn" style="display:none">⏹️ Stop</button>
      <span id="status" class="status-badge">En attente</span>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
